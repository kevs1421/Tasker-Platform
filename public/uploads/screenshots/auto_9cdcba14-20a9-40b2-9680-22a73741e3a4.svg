<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="310" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="310" rx="16" fill="url(#bg)"/>

  <!-- Top accent bar -->
  <rect width="640" height="6" rx="3" fill="#f59e0b"/>

  <!-- Logo area -->
  <text x="40" y="52" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">⏱ Time-In Proof</text>
  <rect x="510" y="32" width="90" height="26" rx="13" fill="#f59e0b" opacity="0.15"/>
  <text x="555" y="50" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f59e0b" text-anchor="middle">TEAM</text>

  <!-- Divider -->
  <line x1="40" y1="70" x2="600" y2="70" stroke="#334155" stroke-width="1"/>

  <!-- User info -->
  <circle cx="60" cy="108" r="20" fill="#f59e0b" opacity="0.2"/>
  <text x="60" y="114" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f59e0b" text-anchor="middle">SC</text>
  <text x="92" y="102" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#f1f5f9">Sarah Chen</text>
  <text x="92" y="122" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">sarah@taskflow.com</text>

  <!-- Timestamp card -->
  <rect x="40" y="145" width="240" height="48" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="58" y="166" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" letter-spacing="0.5">DATE</text>
  <text x="58" y="183" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">Tuesday, July 21, 2026</text>

  <rect x="300" y="145" width="240" height="48" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="318" y="166" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" letter-spacing="0.5">CLOCKED IN AT</text>
  <text x="318" y="183" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">06:00:10 PM</text>

  <!-- Context section -->
  
  <line x1="40" y1="165" x2="600" y2="165" stroke="#334155" stroke-width="0" />
  <text x="40" y="180" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Auto-capture delay: 5s</text>
  

  <!-- Footer -->
  <line x1="40" y1="270" x2="600" y2="270" stroke="#334155" stroke-width="1"/>
  <text x="40" y="292" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Yber Digitals — TaskFlow Automated Screenshot</text>
  <text x="600" y="292" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="end">ID: cmrdtzwl</text>
